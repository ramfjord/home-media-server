---
# Exercises the DEFAULT_GLOBALS → config.local.yml merge, verified via
# the ELP binding seen by service.yml.elp preprocessing:
#   - install_base: set here (covers "local overrides default")
#   - hostname:     set here (covers "local overrides default")
#   - media_path:   nowhere (covers "fall through to DEFAULT_GLOBALS")
install_base: /opt/fx-mediaserver
hostname: fx-host

# Custom keys consumed by fx-prometheus/prometheus.yml.elp via config_yaml[].
fx_label: fixture-deployment

# Per-service deep_merge: scalar replace + array union + hash recursion.
service_overrides:
  fx-caddy:
    desc: Fixture reverse proxy (overridden)
    docker_config:
      image: example.invalid/fx-caddy:overridden
      volumes:
      - "/etc/caddy-extra:/etc/caddy/extra:ro"
  fx-sonarr:
    desc: Fixture TV indexer (overridden)
