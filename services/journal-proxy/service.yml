---
name: journal-proxy
partof: monitoring
desc: NDJSON→JSON-array adapter for systemd-journal-gatewayd
# No dedicated host user — the proxy doesn't read host files, just
# forwards HTTP. Same convention as vaultwarden/api-config/alloy.
user: root
docker_config:
  # Stdlib-only python (http.server + urllib), so we mount proxy.py
  # into the upstream image and avoid maintaining a custom Dockerfile.
  image: python:3.13-alpine
  command:
  - python
  - /usr/local/bin/proxy
  environment:
  - UPSTREAM=http://host.docker.internal:19531
  - PORT=19532
  volumes:
  - "<%= install_base %>/config/journal-proxy/proxy.py:/usr/local/bin/proxy:ro"
  # gatewayd binds 0.0.0.0:19531 on the host. extra_hosts gives this
  # container a host.docker.internal name routing to the docker bridge
  # gateway, reaching the host's loopback the same way prometheus reaches
  # node-exporter.
  extra_hosts:
  - host.docker.internal:host-gateway
  restart: unless-stopped
order: 147
