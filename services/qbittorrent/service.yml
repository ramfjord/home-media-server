---
name: qbittorrent
partof: downloading
desc: torrent client
port: 8080
use_vpn: true
group: mediaserver
docker_config:
  image: lscr.io/linuxserver/qbittorrent:latest
  volumes:
  - "<%= install_base %>/config/qbittorrent:/config"
  - "<%= media_path %>:/data"
  restart: unless-stopped
api_config:
  api_version: v2
  body_format: qbit-form
  # No auth — qBittorrent.conf.elp sets AuthSubnetWhitelist=0.0.0.0/0,
  # which auth-bypasses any caller. Tailnet-only port exposure is the
  # real security boundary.
order: 50
