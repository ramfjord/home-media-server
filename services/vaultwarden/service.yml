---
name: vaultwarden
partof: security
desc: Password manager
port: 80
healthz: "/alive"
user: root  # no dedicated host user; image runs as its own internal user
docker_config:
  image: vaultwarden/server:latest
  volumes:
  - "<%= install_base %>/config/vaultwarden:/data"
  environment:
  - LOG_LEVEL=info
  - DOMAIN=<%= public_url %>
  - SMTP_HOST=smtp
  - SMTP_PORT=25
  - SMTP_SECURITY=off
  - SMTP_FROM=<%= smtp_from %>
  - SMTP_FROM_NAME=Vaultwarden
  restart: unless-stopped
order: 90
