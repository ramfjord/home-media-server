# Single-binary Loki with filesystem storage. Sized for a hobby home
# server (one host, no replication, no clustering). Default retention
# is 30 days — chunks older than that are auto-deleted by the compactor.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h    # 30 days
  volume_enabled: true       # enable label-volume API for Grafana

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 50

# Disable Grafana Labs anonymous usage telemetry.
analytics:
  reporting_enabled: false
