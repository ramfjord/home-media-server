---
name: exportarr-radarr
partof: downloading
desc: Radarr metrics exporter
scrape_target:
  port: 9144
  service: radarr
docker_config:
  image: ghcr.io/onedr0p/exportarr:latest
  command:
  - radarr
  - "--url"
  # `internal_url` resolves to http://wireguard:<port>/<urlbase> for
  # use_vpn services that declare internal_path. Bypassing that
  # composition here is what got the URLBASE prefix out of sync and
  # made exportarr 307-bounce off the API root.
  - "<%= (for-service :radarr internal_url) %>"
  - "--api-key"
  - "<%= (for-service :radarr apikey) %>"
  - "--port"
  - '9144'
  restart: unless-stopped
order: 160
