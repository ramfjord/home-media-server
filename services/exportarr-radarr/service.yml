---
name: exportarr-radarr
partof: downloading
desc: Radarr metrics exporter
scrape_target:
  port: 9144
  service: radarr
docker_config:
  image: ghcr.io/onedr0p/exportarr:latest
  command:
  - radarr
  - "--url"
  # radarr shares wireguard's netns, so its API is reachable as
  # `wireguard:7878` from the mediaserver-network. The earlier
  # `caddy:7878` never worked — caddy binds :443/:8000/:8443, not the
  # arr ports.
  - http://wireguard:7878
  - "--api-key"
  - "<%= (for-service :radarr apikey) %>"
  - "--port"
  - '9144'
  restart: unless-stopped
order: 160
