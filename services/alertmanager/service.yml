---
name: alertmanager
partof: monitoring
desc: Alert management
port: 9093
sighup_reload: true
scrape_target: true
docker_config:
  image: prom/alertmanager:latest
  command:
  - "--config.file=/etc/alertmanager/alertmanager.yml"
  - "--web.external-url=https://<%= hostname %>/alertmanager"
  - "--web.route-prefix=/alertmanager"
  volumes:
  - "<%= install_base %>/config/alertmanager:/etc/alertmanager:ro"
  restart: unless-stopped
order: 120
