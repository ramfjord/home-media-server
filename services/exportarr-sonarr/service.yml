---
name: exportarr-sonarr
partof: downloading
desc: Sonarr metrics exporter
scrape_target:
  port: 9145
  service: sonarr
docker_config:
  image: ghcr.io/onedr0p/exportarr:latest
  command:
  - sonarr
  - "--url"
  # sonarr shares wireguard's netns, so its API is reachable as
  # `wireguard:8989` from the mediaserver-network. The earlier
  # `caddy:8989` never worked — caddy binds :443/:8000/:8443, not the
  # arr ports.
  - http://wireguard:8989
  - "--api-key"
  - "<%= (for-service :sonarr apikey) %>"
  - "--port"
  - '9145'
  restart: unless-stopped
order: 170
