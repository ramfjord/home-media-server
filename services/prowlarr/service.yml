---
name: prowlarr
partof: downloading
desc: indexer manager
port: 9696
healthz: /ping
use_vpn: true
docker_config:
  image: lscr.io/linuxserver/prowlarr:latest
  volumes:
  - "<%= install_base %>/config/prowlarr:/config"
  environment:
  - PROWLARR__SERVER__URLBASE=/prowlarr
  - "PROWLARR__AUTH__APIKEY=<%= (for-service :prowlarr apikey) %>"
  - "PROWLARR__AUTH__METHOD=External"
  - "PROWLARR__AUTH__REQUIRED=DisabledForLocalAddresses"
  restart: unless-stopped
api_config:
  api_version: v1
  auth: { type: header, name: X-Api-Key, value: "<%= (for-service :prowlarr apikey) %>" }
  extra_mutate_query: { forceSave: true }
# Literal block — see services/radarr/service.yml for rationale.
api_resources: |
  upserts:
    applications:
    - name: Sonarr
      syncLevel: fullSync
      implementation: Sonarr
      implementationName: Sonarr
      configContract: SonarrSettings
      enable: true
      fields:
      - { name: prowlarrUrl,     value: "http://localhost:<%= (for-service :prowlarr port) %>" }
      - { name: baseUrl,         value: "http://localhost:<%= (for-service :sonarr port) %>" }
      - { name: apiKey,          value: "<%= (for-service :sonarr apikey) %>" }
      - { name: syncCategories,  value: [5000, 5010, 5020, 5030, 5040, 5045, 5050, 5090] }
    - name: Radarr
      syncLevel: fullSync
      implementation: Radarr
      implementationName: Radarr
      configContract: RadarrSettings
      enable: true
      fields:
      - { name: prowlarrUrl,    value: "http://localhost:<%= (for-service :prowlarr port) %>" }
      - { name: baseUrl,        value: "http://localhost:<%= (for-service :radarr port) %>" }
      - { name: apiKey,         value: "<%= (for-service :radarr apikey) %>" }
      - { name: syncCategories, value: [2000, 2010, 2020, 2030, 2040, 2045, 2050, 2060, 2070, 2080, 2090] }
order: 40
