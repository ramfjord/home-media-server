---
name: prometheus
partof: monitoring
desc: Metrics and alerting
port: 9090
# `internal_path` matches --web.route-prefix below. derive.lisp folds
# it into `internal_url`, and otelcol's scrape_target loop defaults
# `metrics_path` to `<internal_path>/metrics` when not overridden.
internal_path: /prometheus
healthz: /-/healthy
sighup_reload: true
scrape_target: true
docker_config:
  image: prom/prometheus:latest
  command:
  - "--config.file=/etc/prometheus/prometheus.yml"
  - "--web.external-url=https://<%= hostname %>/prometheus"
  - "--web.route-prefix=/prometheus"
  - "--web.enable-remote-write-receiver"
  volumes:
  - "<%= install_base %>/config/prometheus:/etc/prometheus:ro"
  - "<%= install_base %>/config/prometheus/data:/prometheus/data"
  restart: unless-stopped
order: 100
