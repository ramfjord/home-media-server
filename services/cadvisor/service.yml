---
name: cadvisor
partof: monitoring
desc: Container metrics exporter
port: 8080
user: root  # needs root to read docker.sock and /dev/kmsg
scrape_target:
  port: 8080
  # `--url_base_prefix=/cadvisor` mounts cadvisor's UI and /metrics
  # under /cadvisor; otelcol must scrape the prefixed path.
  metrics_path: /cadvisor/metrics
  # cadvisor measures containers; a metric's `service` is the container
  # being measured, not whatever the cadvisor scrape job's service is.
  metric_relabel_configs:
    - source_labels: [name]
      target_label: service
docker_config:
  image: gcr.io/cadvisor/cadvisor:latest
  command:
  - "--url_base_prefix=/cadvisor"
  volumes:
  - "/:/rootfs:ro"
  - "/var/run:/var/run:ro"
  - "/sys:/sys:ro"
  - "/var/lib/docker/:/var/lib/docker:ro"
  - "/dev/disk/:/dev/disk:ro"
  privileged: true
  devices:
  - "/dev/kmsg"
  restart: unless-stopped
order: 140
